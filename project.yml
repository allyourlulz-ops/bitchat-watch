# XcodeGen spec for bitchat-watch.  `brew install xcodegen && xcodegen generate`
# produces BitchatWatch.xcodeproj (not checked in).
#
# Targets
#   BitchatWatch      watchOS 26.0 app (WatchApp + Shared, incl. Shared/AppleBLE)
#   BitchatWatchHost  standalone iPhone host (iOSBridge/Host + the WatchBridgeKit
#                     sources in iOSBridge/Generic, compiled directly) + Shared;
#                     embeds the watch app. Production users run the upstream
#                     bitchat app with upstream-patches/ instead.
#   BitchatTester     macOS tester (MacTester/, AppKit, deployment 10.14, Monocypher)
#
# All Apple targets use the Swift 5 language mode. Shared/ is additionally
# typechecked in Swift 6 mode by Tests/Linux/build.sh.
#
# SPDX-License-Identifier: GPL-3.0-or-later

name: BitchatWatch
options:
  bundleIdPrefix: org.bitchatwatch
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "26.0"
    iOS: "26.0"
    macOS: "10.14"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Debug builds of upstream bitchat use the "testnet" service UUID ...4B5A.
    # Add BITCHAT_TESTNET to SWIFT_ACTIVE_COMPILATION_CONDITIONS to talk to them.
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  BitchatWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: WatchApp
        excludes: ["Info.plist"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bitchatwatch.host.watchkitapp
        PRODUCT_NAME: BitchatWatch
        INFOPLIST_FILE: WatchApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
    scheme: {}

  BitchatWatchHost:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: iOSBridge/Host
        excludes: ["Info.plist"]
      - path: iOSBridge/Generic      # WatchBridgeKit sources (internal, compiled into the app)
      - path: Shared
    dependencies:
      - target: BitchatWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bitchatwatch.host
        PRODUCT_NAME: BitchatWatchHost
        INFOPLIST_FILE: iOSBridge/Host/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    scheme: {}

  BitchatTester:
    type: application
    platform: macOS
    deploymentTarget: "10.14"
    sources:
      - path: MacTester/Sources/Core
      - path: MacTester/Sources/App
        excludes: ["Info.plist"]
      - path: MacTester/Vendor/Monocypher
        includes: ["*.c", "*.h"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bitchatwatch.tester
        PRODUCT_NAME: BitchatTester
        INFOPLIST_FILE: MacTester/Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "10.14"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: MacTester/Sources/App/Tester-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/MacTester/Vendor/Monocypher
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    scheme: {}
